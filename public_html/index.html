<!DOCTYPE html>
<html>
<head>
  <title>Li Jing - OpenAI</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:wght@400;700&display=swap">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body {
      background-color: var(--bg-color); 
      color: var(--text-color);
      font-family: 'Newsreader', serif;
      line-height: 1.6;
      margin: 2em auto;
      max-width: 500px;
      font-size: 18px;
      padding: 0 1em;
    }

    a:link, a:visited, a:hover, a:active {
      color: black; 
      text-decoration: underline; 
    }

    :root {
      --bg-color: #f0efea; 
      --text-color: #141413;
    }

    h1 {
      font-size: 2em;
      margin-bottom: 0.2em;
    }

    p {
      margin-bottom: 1em;
      text-align: left;
    }

    .links {
      margin-top: 2em; 
    }

    .links a {
      display: block;
      margin-bottom: 0.5em;
    }

    .email {
      font-family: monospace;
      font-size: 0.9em;
      background: linear-gradient(-45deg, #141413, #6b6b69, #141413, #6b6b69);
      background-size: 300% 300%;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      animation: gradientAnimation 4s ease infinite;
    }

    @keyframes gradientAnimation {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    @media (max-width: 600px) {
      body {
        margin: 1em 0;
        padding: 0 0.5em;
        max-width: none;
      }
    }
  </style>
</head>

</body>
</html>
